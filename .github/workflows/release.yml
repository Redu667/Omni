name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Defaults to the version in pubspec.yaml.'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Decodes the release keystore when one is configured. Without the
      # secrets the build falls back to the dev key checked into the repo,
      # so forks and first-time setups still produce an installable APK —
      # they just produce one nobody should distribute.
      #
      # Set these up with ./tools/setup-release-signing.sh
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OMNI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release keystore configured — signing with \
          the development key. Run ./tools/setup-release-signing.sh before \
          distributing this build."
            echo "signed_with=development key" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed_with=release key" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          # Empty when unconfigured, which build.gradle.kts treats as
          # "use the dev key".
          OMNI_KEYSTORE_PATH: ${{ secrets.OMNI_KEYSTORE_BASE64 && format('{0}/release.jks', runner.temp) || '' }}
          OMNI_KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          OMNI_KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        run: flutter build apk --release

      # The keystore is deleted whether or not the build succeeded, so a
      # failed run never leaves it on the runner.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Tag precedence: an explicit input, else the pushed tag, else the
      # version in pubspec.yaml — so a plain manual run always releases
      # whatever version the app actually declares.
      - name: Resolve release tag
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            VERSION=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml | head -1 | tr -d '[:space:]')
            if [ -z "$VERSION" ]; then
              echo "::error::Could not read a version from pubspec.yaml"
              exit 1
            fi
            TAG="v$VERSION"
          fi
          APK="omni-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "Releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.apk.outputs.tag }}"
          APK="${{ steps.apk.outputs.apk }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Omni $TAG" \
              --prerelease \
              --generate-notes
          fi
          # Says which key signed it, so a dev-signed build is never
          # mistaken for a distributable one.
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          printf '%s\n\nSigned with the %s.\n' \
            "$BODY" "${{ steps.signing.outputs.signed_with }}" > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

