name: omni
description: "Omni — a unified multi-platform social feed: Mastodon, Bluesky, Reddit, Twitter/X and RSS in one timeline."
publish_to: 'none'

version: 0.3.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  xml: ^6.5.0
  timeago: ^3.7.0
  html_unescape: ^2.0.0
  app_links: ^6.3.2
  file_picker: ^8.1.2
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
